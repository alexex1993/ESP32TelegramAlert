dependencies:
  lvgl/lvgl: "^9.2"
  # PlatformIO's framework-espidf package strips the built-in "json"
  # (cJSON) component, so pull it from the component registry instead.
  espressif/cjson: "^1.7"
  # WS2812 driver for the on-board RGB "unread" LED. Not bundled in
  # PlatformIO's framework-espidf, so fetch it from the registry.
  espressif/led_strip: "^3"
