; PlatformIO Project Configuration File
;
; Waveshare ESP32-C6-LCD-1.47 -- ESP32-C6-WROOM-1 (4 MB flash) with an
; onboard 172x320 ST7789 LCD on SPI2.
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c6-lcd-1_47]
; Pinned so builds reproduce against a known ESP-IDF (v6.0.1 here).
platform = espressif32 @ 7.0.1
board = esp32-c6-devkitc-1
framework = espidf

; The Waveshare module carries 4 MB, not the DevKitC's 8 MB.
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304

; Default single-app table only gives the app 1MB; LVGL + mbedTLS + WiFi
; need more than that, so use a custom table sized for this board's 4MB flash.
board_build.partitions = partitions.csv

; The board exposes only the ESP32-C6's built-in USB-Serial-JTAG.
upload_protocol = esptool
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct

; Device settings (WiFi, bot token, proxy, language, timezone) are configured at
; runtime through the first-boot captive portal, not at build time -- so no
; .env / secrets.h generation step is needed and one image flashes to every
; device. See provision.c.
